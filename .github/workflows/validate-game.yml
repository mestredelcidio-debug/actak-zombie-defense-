name: Validate game build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/ultima-esperanca]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Type-check
        run: npm run lint
      - name: Build production bundle
        run: npm run build
