name: Validate game build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/ultima-esperanca]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run lint
      - name: Build production bundle
        run: bun run build
